<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Capri</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; cursor: default; }
    canvas { position: fixed; left: 0; top: 0; }
    /* ===== globo de Capri (panel con retrato) ===== */
    #bubble {
      --panel: #160f1e; --edge: #7b3cff; --edge2: #4b1fa8; --tail-x: 60px;
      position: fixed; left: 0; top: 0; width: 330px;
      opacity: 0; transition: opacity .2s; pointer-events: none;
      font-family: Bahnschrift, 'Segoe UI', sans-serif; color: #f4eefc;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.45));
    }
    #bubble.show { opacity: 1; }
    #bubble .slab, #bubble .panel { clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
    #bubble .slab { position: absolute; inset: 0; transform: translate(7px, 7px); background: linear-gradient(135deg, var(--edge), var(--edge2)); }
    #bubble .panel { position: relative; display: flex; gap: 13px; padding: 13px 15px 15px 13px; background: var(--panel); box-shadow: inset 0 0 0 1.5px rgba(123,60,255,.55); }
    #bubble .tail, #bubble .tail-slab { position: absolute; width: 26px; height: 16px; clip-path: polygon(0 0, 100% 0, 30% 100%); }
    #bubble .tail { left: var(--tail-x); bottom: -15px; background: var(--panel); }
    #bubble .tail-slab { left: calc(var(--tail-x) + 4px); bottom: -22px; background: var(--edge); }
    #bubble.side .tail, #bubble.side .tail-slab { display: none; }
    #bubble .avatar { flex: 0 0 auto; width: 68px; height: 68px; padding: 3px; box-sizing: border-box; background: var(--edge);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    #bubble .avatar img { width: 100%; height: 100%; object-fit: cover; display: block;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    #bubble .body { flex: 1; min-width: 0; }
    #bubble .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    #bubble .name { font-size: 11px; letter-spacing: 4px; color: #b7a9cc; font-weight: 600; }
    #bubble .badge { font-size: 10px; letter-spacing: 2px; padding: 3px 7px 3px 9px; color: #d8c8ff; background: rgba(123,60,255,.28);
      box-shadow: inset 0 0 0 1px rgba(160,110,255,.7); clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px); }
    #bubble .badge.local { color: #b9ffe0; background: rgba(39,245,155,.14); box-shadow: inset 0 0 0 1px rgba(39,245,155,.6); }
    #bubble .badge.ollama { color: #ffd0e2; background: rgba(255,35,104,.18); box-shadow: inset 0 0 0 1px rgba(255,35,104,.65); }
    #bubble.thinking .badge { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .4; } }
    #bubble .msg { font-size: 17px; line-height: 1.3; white-space: pre-wrap; word-wrap: break-word; min-height: 22px; }
    #bubble.thinking .msg::after { content: '• • •'; letter-spacing: 3px; animation: dots 1.2s infinite; }
    @keyframes dots { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    #bubble .page { font-size: 10px; letter-spacing: 2px; color: #b7a9cc; text-align: right; margin-top: 4px; }
    #bubble .page:empty { display: none; }
    /* ===== menú del clic derecho (estilo Capri) ===== */
    .cm-panel { position: fixed; min-width: 230px; max-width: 360px; z-index: 50;
      font-family: Bahnschrift, 'Segoe UI', sans-serif; color: #f4eefc; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
    .cm-slab, .cm-body { clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
    .cm-slab { position: absolute; inset: 0; transform: translate(6px, 6px); background: linear-gradient(135deg, #7b3cff, #4b1fa8); }
    .cm-body { position: relative; padding: 8px 6px; background: #160f1e; box-shadow: inset 0 0 0 1.5px rgba(123,60,255,.55); }
    .cm-tag { font: 10px Consolas, 'Cascadia Mono', monospace; letter-spacing: 2px; color: #ff2a6d; text-shadow: 0 0 6px #ff2a6d; padding: 2px 10px 7px; }
    .cm-item { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; font-size: 14px; cursor: default;
      clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px); }
    .cm-item:hover:not(.disabled), .cm-item.open { background: rgba(123,60,255,.32); box-shadow: inset 3px 0 0 #27f59b; }
    .cm-item.disabled { color: #8c7fa3; }
    .cm-item.disabled:first-child, .cm-tag + .cm-item.disabled { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
    .cm-mark { width: 14px; text-align: center; color: #27f59b; text-shadow: 0 0 6px rgba(39,245,155,.7); font-size: 13px; flex: 0 0 auto; }
    .cm-mark.radio { font-size: 11px; }
    .cm-item:not(:hover) .cm-mark.radio:not(:empty) { opacity: .95; }
    .cm-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cm-acc { font: 11px Consolas, monospace; color: #b7a9cc; margin-left: 10px; }
    .cm-arrow { color: #ff2368; font-size: 16px; margin-left: 6px; }
    .cm-sep { height: 1px; margin: 5px 8px; background: linear-gradient(90deg, transparent, rgba(123,60,255,.8), transparent); }
    /* cuadro para pedirle cosas */
    #ask {
      position: fixed; left: 0; top: 0; width: 300px; display: none;
      padding: 8px 10px 10px; background: rgba(14, 6, 26, 0.96);
      border: 1px solid #27f59b; box-shadow: 0 0 16px rgba(39, 245, 155, 0.45), 4px 4px 0 #6a2bff;
      font: 13px Consolas, 'Cascadia Mono', monospace; color: #ffe3ee;
    }
    #ask.show { display: block; }
    #ask .tag { display: block; color: #ff2a6d; font-size: 10px; letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 6px #ff2a6d; }
    #ask input {
      width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #6a2bff; outline: none;
      background: #07030f; color: #ffffff; font: inherit; caret-color: #27f59b; user-select: text;
    }
    #ask input:focus { border-color: #27f59b; }
    #ask .hint { margin-top: 5px; font-size: 10px; color: #b98fc9; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble">
    <div class="slab"></div>
    <div class="panel">
      <div class="avatar"><img id="bubble-avatar" src="assets/avatar_capri.png" alt=""></div>
      <div class="body">
        <div class="head"><span class="name">CAPRI</span><span id="bubble-badge" class="badge local">LOCAL</span></div>
        <div id="bubble-text" class="msg"></div>
        <div id="bubble-page" class="page"></div>
      </div>
    </div>
    <div class="tail-slab"></div><div class="tail"></div>
  </div>
  <div id="capri-menu"></div>
  <div id="ask"><span class="tag" id="ask-tag">PEDIRLE ALGO A CAPRI://</span>
    <input id="ask-input" type="text" spellcheck="false" autocomplete="off">
    <div class="hint" id="ask-hint">Enter para enviar · Esc para cerrar</div>
  </div>
  <script src="lines.js"></script>
  <script src="assets/atlas_hd.js"></script>
  <script src="renderer.js"></script>
  <script src="env.js"></script>
  <script src="commands.js"></script>
  <script src="menu.js"></script>
</body>
</html>
